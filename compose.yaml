services:
  db:
    container_name: mariadb_lib
    image: mariadb:11.4.10
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./scripts:/scripts:z
      - ./scripts/init.sh:/docker-entrypoint-initdb.d/init.sh:z

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
